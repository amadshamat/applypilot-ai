<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme - Cloud Support Intern</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 680px;
        margin: 2rem auto;
      }
      .application-label {
        display: block;
        margin-top: 0.75rem;
        font-weight: 600;
      }
      .invisible-resume-upload {
        opacity: 0;
        position: absolute;
        width: 1px;
      }
    </style>
  </head>
  <body>
    <!--
    Sample application modeled on the public markup of a Lever job posting's
    apply page: one full-name field, current company, link fields named
    urls[...], a resume upload, custom question cards, the optional EEO
    survey and an hCaptcha box. Written for tests; not copied from a live page.
    Submitting increments window.submitCount.
  -->
    <div class="posting-headline">
      <h2>Cloud Support Intern</h2>
      <div class="posting-categories">Remote · Internship</div>
    </div>
    <form
      id="application-form"
      method="POST"
      enctype="multipart/form-data"
      action="/acme/123/apply"
    >
      <div class="section application-form">
        <h4>Submit your application</h4>
        <ul>
          <li class="application-question resume">
            <label
              ><div class="application-label">Resume/CV<span class="required">✱</span></div>
              <div class="application-field">
                <a class="visible-resume-upload">Attach resume/CV</a>
                <input
                  class="invisible-resume-upload"
                  type="file"
                  name="resume"
                  id="resume-upload-input"
                  required
                />
              </div>
            </label>
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">Full name<span class="required">✱</span></div>
              <div class="application-field"><input type="text" name="name" required /></div
            ></label>
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">Pronouns</div>
              <div class="application-field"><input type="text" name="pronouns" /></div
            ></label>
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">Email<span class="required">✱</span></div>
              <div class="application-field"><input type="email" name="email" required /></div
            ></label>
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">Phone</div>
              <div class="application-field"><input type="text" name="phone" /></div
            ></label>
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">Current location</div>
              <div class="application-field">
                <input type="text" name="location" id="location-input" /></div
            ></label>
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">Current company</div>
              <div class="application-field"><input type="text" name="org" /></div
            ></label>
          </li>
        </ul>
      </div>
      <div class="section application-form">
        <h4>Links</h4>
        <ul>
          <li class="application-question">
            <label
              ><div class="application-label">LinkedIn URL</div>
              <div class="application-field"><input type="text" name="urls[LinkedIn]" /></div
            ></label>
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">GitHub URL</div>
              <div class="application-field"><input type="text" name="urls[GitHub]" /></div
            ></label>
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">Portfolio URL</div>
              <div class="application-field"><input type="text" name="urls[Portfolio]" /></div
            ></label>
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">Other website</div>
              <div class="application-field"><input type="text" name="urls[Other]" /></div
            ></label>
          </li>
        </ul>
      </div>
      <div class="section application-form">
        <h4>Additional questions</h4>
        <ul>
          <li class="application-question custom-question">
            <div class="application-label full-width">Which AWS services have you used?</div>
            <ul data-qa="checkboxes" class="application-field">
              <li>
                <label
                  ><input type="checkbox" name="cards[c1][field0]" value="EC2" /><span
                    class="application-answer-alternative"
                    >EC2</span
                  ></label
                >
              </li>
              <li>
                <label
                  ><input type="checkbox" name="cards[c1][field0]" value="S3" /><span
                    class="application-answer-alternative"
                    >S3</span
                  ></label
                >
              </li>
              <li>
                <label
                  ><input type="checkbox" name="cards[c1][field0]" value="Lambda" /><span
                    class="application-answer-alternative"
                    >Lambda</span
                  ></label
                >
              </li>
            </ul>
          </li>
          <li class="application-question custom-question">
            <div class="application-label full-width">
              Will you require sponsorship for employment visa status?<span class="required"
                >✱</span
              >
            </div>
            <ul data-qa="multiple-choice" class="application-field">
              <li>
                <label
                  ><input type="radio" name="cards[c1][field1]" value="Yes" required /><span
                    class="application-answer-alternative"
                    >Yes</span
                  ></label
                >
              </li>
              <li>
                <label
                  ><input type="radio" name="cards[c1][field1]" value="No" /><span
                    class="application-answer-alternative"
                    >No</span
                  ></label
                >
              </li>
            </ul>
          </li>
          <li class="application-question custom-question">
            <label
              ><div class="application-label full-width">
                Tell us about a technical problem you solved.
              </div>
              <div class="application-field"><textarea name="cards[c1][field2]"></textarea></div
            ></label>
          </li>
        </ul>
      </div>
      <div class="section application-form eeo-section">
        <h4>U.S. Equal Employment Opportunity information (Completion is voluntary)</h4>
        <ul>
          <li class="application-question">
            <label
              ><div class="application-label">Gender</div>
              <div class="application-field">
                <select name="eeo[gender]">
                  <option value="">Select ...</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Decline to self-identify</option>
                </select>
              </div></label
            >
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">Race</div>
              <div class="application-field">
                <select name="eeo[race]">
                  <option value="">Select ...</option>
                  <option>Asian</option>
                  <option>White</option>
                  <option>Decline to self-identify</option>
                </select>
              </div></label
            >
          </li>
          <li class="application-question">
            <label
              ><div class="application-label">Veteran status</div>
              <div class="application-field">
                <select name="eeo[veteran]">
                  <option value="">Select ...</option>
                  <option>I am a veteran</option>
                  <option>I am not a veteran</option>
                  <option>Decline to self-identify</option>
                </select>
              </div></label
            >
          </li>
        </ul>
      </div>
      <div class="section application-form">
        <h4>Additional information</h4>
        <textarea
          name="comments"
          id="additional-information"
          placeholder="Add a cover letter or anything else you want to share."
        ></textarea>
      </div>
      <div class="h-captcha" data-sitekey="sample-site-key"></div>
      <button type="submit" class="postings-btn template-btn-submit" id="btn-submit">
        Submit application
      </button>
    </form>
    <script>
      window.submitCount = 0;
      document.getElementById('application-form').addEventListener('submit', function (event) {
        event.preventDefault();
        window.submitCount += 1;
      });
    </script>
  </body>
</html>
